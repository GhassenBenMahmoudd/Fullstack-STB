<style>
  .h-100vh {
    height: 100vh;
  }

  @media (max-width: 991.98px) {
    .h-100vh {
      height: 200px; /* hauteur de l'image en mobile */
    }
  }
</style>

<div class="main-wrapper">
  <div class="d-flex flex-column flex-lg-row align-items-stretch min-vh-100">

    <!-- Left image -->
    <div class="jarallax overlay overlay-primary overlay-70 col-12 col-lg-5 d-flex align-items-center h-100vh px-2"
         data-jarallax data-speed="0.9"
         style="background-image: url(assets/img/content/vericla-cover.png); background-size: cover; background-position: center;">
      <div class="w-100 p-5 text-center">
        <div class="position-relative">
          <h1 class="text-white font-weight-normal">Rejoignez Notre Communauté</h1>
          <p class="text-white-90 mb-0 w-85 w-xl-70 mx-auto">
            Accédez à votre espace pour gérer vos déclarations et consulter vos informations.
          </p>
        </div>
      </div>
    </div>

    <!-- Right form -->
    <div class="container d-flex align-items-center justify-content-center col-12 col-lg-7">
      <div class="row justify-content-center w-100">
        <div class="col-12 col-sm-10 col-md-8 col-lg-10 col-xl-8 my-5 px-4 px-sm-0">

          <div class="mb-6 text-center text-lg-start">
            <h2 class="font-weight-normal mb-0">Bienvenue sur <span class="text-primary">STB</span></h2>
            <p class="mb-0">Connectez-vous à votre compte.</p>
          </div>

          <!-- Gestion des erreurs -->
          <div *ngIf="errorMessage" class="alert alert-danger">
            {{ errorMessage }}
          </div>

          <!-- Formulaire Angular -->
          <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
            <div class="row">
              <!-- Matricule ou Email -->
              <div class="col-12 mb-2">
                <div class="form-group">
                  <label for="identifier">Matricule ou Email</label>
                  <input type="text" class="form-control" id="identifier" name="identifier"
                         placeholder="Votre matricule ou email"
                         [(ngModel)]="identifierInput" required #identifier="ngModel">
                </div>
              </div>

              <!-- Mot de passe -->
              <div class="col-12 mb-2">
                <div class="form-group">
                  <label for="password">Mot de passe</label>
                  <input type="password" class="form-control" id="password" name="password"
                         placeholder="Votre mot de passe"
                         [(ngModel)]="credentials.password" required #password="ngModel">
                  <div *ngIf="password.invalid && (password.dirty || password.touched)"
                       class="text-danger small mt-1">
                    Le mot de passe est requis.
                  </div>
                </div>
              </div>
            </div>

            <div class="row mt-2">
              <div class="col-md-12 center">
                <button type="submit" class="btn btn-primary w-100 mt-4 mb-2" [disabled]="loginForm.invalid || isLoading">
                  <span *ngIf="isLoading" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                  {{ isLoading ? 'Connexion...' : 'Se connecter' }}
                </button>
              </div>
            </div>
          </form>
            <div class="mt-3 text-center">
              <span>Vous n'avez pas de compte ? </span> 
              <a routerLink="/register">Créer un compte</a>
            </div>
        </div>
      </div>
    </div>

  </div>
</div>
