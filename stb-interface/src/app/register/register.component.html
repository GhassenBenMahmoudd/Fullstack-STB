<div class="container my-5">
  <h2>Créer un compte</h2>

  <form (ngSubmit)="onSubmit()">
    <div class="form-group mb-2">
      <label>Prénom</label>
      <input class="form-control" [(ngModel)]="registerData.Prenom" name="prenom" required>
    </div>

    <div class="form-group mb-2">
      <label>Nom</label>
      <input class="form-control" [(ngModel)]="registerData.Nom" name="nom" required>
    </div>

    <div class="form-group mb-2">
      <label>Email</label>
      <input type="email" class="form-control" [(ngModel)]="registerData.Email" name="email" required>
    </div>

    <div class="form-group mb-2">
      <label>Numéro de téléphone</label>
      <input class="form-control" [(ngModel)]="registerData.NumeroTelephone" name="numeroTelephone">
    </div>

    <div class="form-group mb-2">
      <label>Mot de passe</label>
      <input type="password" class="form-control" [(ngModel)]="registerData.Password" name="password" required>
    </div>

    <div *ngIf="errorMessage" class="alert alert-danger mt-2">{{ errorMessage }}</div>
    <div *ngIf="successMessage" class="alert alert-success mt-2">{{ successMessage }}</div>

    <button class="btn btn-primary mt-3" type="submit" [disabled]="isLoading">
      <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2"></span>
      {{ isLoading ? 'Inscription...' : 'S’inscrire' }}
    </button>
    <div class="mt-3 text-center">
  <span>Vous avez déjà un compte ? </span> 
  <a routerLink="/login">Se connecter</a>
</div>

  </form>
</div>
